# syswatch configuration file

# Expanded list of monitored services
MONITORED_SERVICES=(
  "apache2"
  "mysql"
  "docker"
  "tomcat"
  "nginx"
  "postgresql"
  "ssh"
  "redis-server"
  "mongodb"
  "memcached"
  "valkey"
  "ufw"
  "fail2ban"
  "cron"
  "rsyslog"
  "postfix"
  "php8.3-fpm"
  "supervisor"
)

# Services to ignore/block if needed
IGNORED_SERVICES=("mongodb" "postfix")

# Warning thresholds (percentages)
RAM_WARN_THRESHOLD=70
RAM_CRIT_THRESHOLD=85
DISK_CRIT_THRESHOLD=90